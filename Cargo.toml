[package]
name = "job-system"
version = "0.1.0"
edition = "2024"
authors = ["Jaya Micoud <jaya.micoud@gmail.com>"]
license = "MIT OR Apache-2.0"

[dependencies]
bitfield-struct = "0.13.0"

[target.'cfg(loom)'.dependencies]
loom = "0.7"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[dev-dependencies]
criterion = "0.8"


[[bench]]
name = "scheduler"
harness = false
